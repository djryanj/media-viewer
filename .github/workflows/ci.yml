name: CI

on:
    push:
        branches:
            - '**'
    pull_request:
        branches:
            - main

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    changes:
        name: Detect Changes
        runs-on: ubuntu-latest
        permissions:
            pull-requests: read
        outputs:
            go: ${{ steps.filter.outputs.go }}
            frontend: ${{ steps.filter.outputs.frontend }}
            static_only: ${{ steps.filter.outputs.static_only }}
            docker: ${{ steps.filter.outputs.docker }}
            docker_related: ${{ steps.filter.outputs.docker_related }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
              with:
                  fetch-depth: 0

            - name: Check for changes
              uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
              id: filter
              with:
                  filters: |
                      go:
                        - '**/*.go'
                        - 'go.mod'
                        - 'go.sum'
                        - 'Makefile'
                      frontend:
                        - 'static/**/*.js'
                        - 'static/**/*.css'
                        - 'static/**/*.html'
                        - 'static/package.json'
                        - 'static/package-lock.json'
                        - 'static/vitest.config.js'
                        - 'static/playwright.config.js'
                        - 'static/eslint.config.js'
                      static_only:
                        - 'static/**'
                      docker:
                        - 'Dockerfile'
                        - 'Dockerfile.nvidia'
                        - '.dockerignore'
                      docker_related:
                        - 'Dockerfile'
                        - 'Dockerfile.nvidia'
                        - '.dockerignore'
                        - '.github/workflows/*.yml'
    # ──────────────────────────────────────────────
    # STAGE 0: Prepare sample media (runs early,
    #          can take ~10 min on cold cache)
    # ──────────────────────────────────────────────

    prepare-sample-media:
        name: Prepare Sample Media
        runs-on: ubuntu-latest
        needs: changes
        if: |
            github.event_name == 'pull_request' &&
            (
              needs.changes.outputs.frontend == 'true' ||
              needs.changes.outputs.go == 'true' ||
              needs.changes.outputs.docker_related == 'true'
            )
        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

            - name: Check if sample media cache exists
              id: cache-check
              uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
              with:
                  path: ${{ github.workspace }}/.sample-media-cache
                  key: sample-media-${{ hashFiles('hack/download-sample-media.sh') }}
                  # Fall back to any previous version of the cache.
                  # Files are preserved/skipped by the download script,
                  # so a stale cache just means fewer downloads.
                  restore-keys: |
                      sample-media-

            - name: Install media tools
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends ffmpeg libimage-exiftool-perl

            - name: Download sample media
              if: steps.cache-check.outputs.cache-hit != 'true'
              run: |
                  chmod +x ./hack/download-sample-media.sh
                  ./hack/download-sample-media.sh
              env:
                  MEDIA_DIR: ${{ github.workspace }}/.sample-media-cache

            - name: Save sample media cache
              if: steps.cache-check.outputs.cache-hit != 'true'
              uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
              with:
                  path: ${{ github.workspace }}/.sample-media-cache
                  key: sample-media-${{ hashFiles('hack/download-sample-media.sh') }}

    prepare-frontend-deps:
        name: Prepare Frontend Dependencies
        runs-on: ubuntu-latest
        needs: changes
        if: |
            needs.changes.outputs.frontend == 'true' ||
            (
              github.event_name == 'pull_request' &&
              (
                needs.changes.outputs.go == 'true' ||
                needs.changes.outputs.docker_related == 'true'
              )
            )
        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

            - name: Set up Node.js
              uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
              with:
                  node-version: '24.14.1'
                  cache: 'npm'
                  cache-dependency-path: static/package-lock.json

            - name: Install frontend dependencies
              working-directory: ./static
              run: npm ci

            - name: Archive frontend dependencies
              run: tar -czf frontend-deps.tgz -C static node_modules

            - name: Upload frontend dependency artifact
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
              with:
                  name: frontend-deps
                  path: frontend-deps.tgz
                  retention-days: 1

    build-binary-pr:
        name: Build Binary for Frontend Integration Tests
        runs-on: ubuntu-latest
        needs: [changes]
        if: |
            github.event_name == 'pull_request' &&
            needs.changes.outputs.frontend == 'true' &&
            needs.changes.outputs.go == 'false'
        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

            - name: Install libvips
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libvips-dev

            - name: Set up Go
              uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Build application
              run: |
                  make build

            - name: Upload binary artifact
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
              with:
                  name: media-viewer-binary
                  path: media-viewer
                  retention-days: 1

    # ──────────────────────────────────────────────
    # STAGE 1: Linting (runs first, gates everything)
    # ──────────────────────────────────────────────

    lint:
        name: Backend Lint
        runs-on: ubuntu-latest
        needs: changes
        if: needs.changes.outputs.go == 'true'
        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

            - name: Install libvips
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libvips-dev
            - name: Set up Go
              uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Run golangci-lint
              uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9
              with:
                  version: v2.11.4
                  args: --config=.golangci.yml --timeout=5m

    lint-frontend:
        name: Frontend Lint
        runs-on: ubuntu-latest
        needs: [changes, prepare-frontend-deps]
        if: needs.changes.outputs.frontend == 'true'
        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

            - name: Set up Node.js
              uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
              with:
                  node-version: '24.14.1'
                  cache: 'npm'
                  cache-dependency-path: static/package-lock.json

            - name: Download frontend dependency artifact
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: frontend-deps
                  path: ./artifacts/frontend-deps

            - name: Extract frontend dependency artifact
              run: |
                  rm -rf ./static/node_modules
                  tar -xzf ./artifacts/frontend-deps/frontend-deps.tgz -C ./static

            - name: Run ESLint (JavaScript)
              working-directory: ./static
              run: npm run lint:js

            - name: Run Stylelint (CSS)
              working-directory: ./static
              run: npm run lint:css

            - name: Check formatting (Prettier)
              working-directory: ./static
              run: npm run format:check

    # ──────────────────────────────────────────────
    # STAGE 2: Backend binary build + Unit Tests (gated on lint)
    # ──────────────────────────────────────────────

    build-binary-check:
        name: Backend Build Check
        runs-on: ubuntu-latest
        needs: [changes, lint, build-binary-pr]
        if: |
            always() &&
            (needs.lint.result == 'success' || needs.lint.result == 'skipped') &&
            needs.build-binary-pr.result == 'skipped' &&
            needs.changes.outputs.go == 'true'
        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

            - name: Install libvips
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libvips-dev

            - name: Set up Go
              uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Build application
              run: |
                  make build

            - name: Build password reset tool
              run: |
                  make resetpw

            - name: Upload binary artifact
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
              with:
                  name: media-viewer-binary
                  path: media-viewer
                  retention-days: 1

    test-unit:
        name: Backend Unit Tests
        runs-on: ubuntu-latest
        needs: [changes, lint]
        if: |
            always() &&
            (needs.lint.result == 'success' || needs.lint.result == 'skipped') &&
            needs.changes.outputs.go == 'true'
        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

            - name: Install libvips
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libvips-dev
            - name: Set up Go
              uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Run unit tests
              run: |
                  make test-unit
            - name: Generate coverage report
              if: always()
              run: |
                  echo "## Unit Test Coverage" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo '```' >> $GITHUB_STEP_SUMMARY
                  go tool cover -func=coverage-unit.out | tail -20 >> $GITHUB_STEP_SUMMARY
                  echo '```' >> $GITHUB_STEP_SUMMARY
            - name: Upload test results
              if: always()
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
              with:
                  name: unit-test-results
                  path: |
                      coverage-unit.out
                      test-unit.json
    test-frontend-unit:
        name: Frontend Unit Tests
        runs-on: ubuntu-latest
        # CHANGED: Now depends on lint-frontend — don't test if lint fails
        # CHANGED: Simplified condition (removed redundant clause)
        needs: [changes, lint-frontend, prepare-frontend-deps]
        if: |
            always() &&
            (needs.lint-frontend.result == 'success' || needs.lint-frontend.result == 'skipped') &&
            needs.changes.outputs.frontend == 'true'
        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

            - name: Set up Node.js
              uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
              with:
                  node-version: '24.14.1'
                  cache: 'npm'
                  cache-dependency-path: static/package-lock.json

            - name: Download frontend dependency artifact
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: frontend-deps
                  path: ./artifacts/frontend-deps

            - name: Extract frontend dependency artifact
              run: |
                  rm -rf ./static/node_modules
                  tar -xzf ./artifacts/frontend-deps/frontend-deps.tgz -C ./static

            - name: Run frontend unit tests with coverage
              working-directory: ./static
              run: npm run test:unit:coverage

            - name: Generate frontend unit coverage summary
              if: always()
              run: |
                  echo "## Frontend Unit Test Coverage" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  if [ -f static/coverage/coverage-summary.json ]; then
                    echo '```json' >> $GITHUB_STEP_SUMMARY
                    cat static/coverage/coverage-summary.json >> $GITHUB_STEP_SUMMARY
                    echo '```' >> $GITHUB_STEP_SUMMARY
                  else
                    echo "No coverage report generated" >> $GITHUB_STEP_SUMMARY
                  fi
            - name: Upload frontend unit coverage
              if: always()
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
              with:
                  name: frontend-unit-test-results
                  path: static/coverage/

    # ──────────────────────────────────────────────
    # STAGE 3: Integration / Expensive Tests
    #          (gated on unit tests passing)
    # ──────────────────────────────────────────────

    test-integration:
        name: Backend Integration Tests
        runs-on: ubuntu-latest
        needs: [changes, test-unit]
        if: |
            github.event_name == 'pull_request' &&
            needs.test-unit.result == 'success' &&
            needs.changes.outputs.go == 'true'
        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

            - name: Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libvips-dev ffmpeg libimage-exiftool-perl
            - name: Set up Go
              uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Run integration tests
              run: |
                  make test-integration
              env:
                  MEDIA_DIR: /tmp/media

            - name: Generate integration coverage summary
              if: always()
              run: |
                  echo "## Integration Test Coverage" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo '```' >> $GITHUB_STEP_SUMMARY
                  if [ -f coverage-integration.out ]; then
                      go tool cover -func=coverage-integration.out | tail -20 >> $GITHUB_STEP_SUMMARY
                  else
                      echo "No coverage file generated" >> $GITHUB_STEP_SUMMARY
                  fi
                  echo '```' >> $GITHUB_STEP_SUMMARY
            - name: Upload coverage
              if: always()
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
              with:
                  name: integration-test-results
                  path: |
                      coverage-integration.out
                      test-integration.json
    test-race:
        name: Backend Race Detector
        runs-on: ubuntu-latest
        needs: [changes, test-unit]
        if: |
            github.event_name == 'pull_request' &&
            needs.test-unit.result == 'success' &&
            needs.changes.outputs.go == 'true'
        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

            - name: Install libvips, ffmpeg, and exiftool
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libvips-dev ffmpeg libimage-exiftool-perl
            - name: Set up Go
              uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Run tests with race detector
              run: |
                  make test-race
    test-frontend-integration:
        name: Frontend Integration Tests
        runs-on: ubuntu-latest
        needs:
            [
                changes,
                build-binary-pr,
                build-binary-check,
                test-frontend-unit,
                prepare-sample-media,
                prepare-frontend-deps,
            ]
        if: |
            always() &&
            github.event_name == 'pull_request' &&
            (
              (needs.build-binary-pr.result == 'success' || needs.build-binary-pr.result == 'skipped') ||
              (needs.build-binary-check.result == 'success' || needs.build-binary-check.result == 'skipped')
            ) &&
            (needs.test-frontend-unit.result == 'success' || needs.test-frontend-unit.result == 'skipped') &&
            (needs.prepare-sample-media.result == 'success' || needs.prepare-sample-media.result == 'skipped') &&
            needs.changes.outputs.frontend == 'true'
        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

            - name: Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libvips-dev ffmpeg
            - name: Set up Node.js
              uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
              with:
                  node-version: '24.14.1'
                  cache: 'npm'
                  cache-dependency-path: static/package-lock.json

            - name: Download frontend dependency artifact
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: frontend-deps
                  path: ./artifacts/frontend-deps

            - name: Extract frontend dependency artifact
              run: |
                  rm -rf ./static/node_modules
                  tar -xzf ./artifacts/frontend-deps/frontend-deps.tgz -C ./static

            - name: Download backend binary
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: media-viewer-binary
                  path: .

            - name: Make binary executable
              run: chmod +x ./media-viewer

            - name: Restore sample media cache
              uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
              with:
                  path: ${{ github.workspace }}/.sample-media-cache
                  key: sample-media-${{ hashFiles('hack/download-sample-media.sh') }}

            - name: Copy sample media to runtime location
              run: |
                  cp -r ${{ github.workspace }}/.sample-media-cache /tmp/media

            - name: Run frontend integration tests
              run: |
                  make frontend-test-integration-auto
              env:
                  MEDIA_DIR: /tmp/media
                  BINARY_PATH: ${{ github.workspace }}/media-viewer
                  TEST_SERVER_SKIP_BUILD: 'true'
                  TEST_SERVER_KEEP_TEMP: 'true'
                  TEST_SERVER_LOG_LEVEL: info
                  LOG_HEALTH_CHECKS: 'false'
                  METRICS_ENABLED: 'false'

            - name: Upload backend logs on failure
              if: failure()
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
              with:
                  name: backend-server-logs
                  path: ${{ env.TEST_SERVER_LOG }}
                  retention-days: 7

            - name: Upload frontend integration results
              if: always()
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
              with:
                  name: frontend-integration-test-results
                  path: static/test-results/vitest-results.json

    test-frontend-e2e-smoke:
        name: Frontend Playwright Smoke
        runs-on: ubuntu-latest
        needs:
            [
                changes,
                build-binary-pr,
                build-binary-check,
                test-frontend-unit,
                prepare-sample-media,
                prepare-frontend-deps,
            ]
        if: |
            always() &&
            github.event_name == 'pull_request' &&
            (
              (needs.build-binary-pr.result == 'success' || needs.build-binary-pr.result == 'skipped') ||
              (needs.build-binary-check.result == 'success' || needs.build-binary-check.result == 'skipped')
            ) &&
            (needs.test-frontend-unit.result == 'success' || needs.test-frontend-unit.result == 'skipped') &&
            (needs.prepare-sample-media.result == 'success' || needs.prepare-sample-media.result == 'skipped') &&
            needs.changes.outputs.frontend == 'true'
        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

            - name: Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libvips-dev ffmpeg

            - name: Set up Node.js
              uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
              with:
                  node-version: '24.14.1'
                  cache: 'npm'
                  cache-dependency-path: static/package-lock.json

            - name: Download frontend dependency artifact
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: frontend-deps
                  path: ./artifacts/frontend-deps

            - name: Extract frontend dependency artifact
              run: |
                  rm -rf ./static/node_modules
                  tar -xzf ./artifacts/frontend-deps/frontend-deps.tgz -C ./static

            - name: Install Playwright Chromium
              working-directory: ./static
              run: npx playwright install --with-deps chromium

            - name: Download backend binary
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: media-viewer-binary
                  path: .

            - name: Make binary executable
              run: chmod +x ./media-viewer

            - name: Restore sample media cache
              uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
              with:
                  path: ${{ github.workspace }}/.sample-media-cache
                  key: sample-media-${{ hashFiles('hack/download-sample-media.sh') }}

            - name: Copy sample media to runtime location
              run: |
                  cp -r ${{ github.workspace }}/.sample-media-cache /tmp/media

            - name: Run Playwright smoke suite
              run: |
                  make frontend-test-e2e-smoke-auto
              env:
                  CI: true
                  MEDIA_DIR: /tmp/media
                  BINARY_PATH: ${{ github.workspace }}/media-viewer
                  TEST_SERVER_SKIP_BUILD: 'true'
                  TEST_SERVER_KEEP_TEMP: 'true'
                  TEST_SERVER_LOG_LEVEL: info
                  LOG_HEALTH_CHECKS: 'false'
                  METRICS_ENABLED: 'false'

            - name: Upload backend logs on failure
              if: failure()
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
              with:
                  name: backend-server-logs-e2e-smoke
                  path: ${{ env.TEST_SERVER_LOG }}
                  retention-days: 7

            - name: Upload Playwright smoke results
              if: always()
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
              with:
                  name: frontend-e2e-smoke-results
                  path: static/e2e/test-results/

            - name: Upload Playwright smoke report
              if: always()
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
              with:
                  name: playwright-smoke-report
                  path: static/e2e/playwright-report/
                  retention-days: 30

    test-docker-runtime-e2e:
        name: Docker Runtime Smoke
        runs-on: ubuntu-latest
        needs: [changes, lint, lint-frontend, prepare-sample-media, prepare-frontend-deps]
        if: |
            always() &&
            github.event_name == 'pull_request' &&
            (needs.lint.result == 'success' || needs.lint.result == 'skipped') &&
            (needs.lint-frontend.result == 'success' || needs.lint-frontend.result == 'skipped') &&
            (needs.prepare-sample-media.result == 'success' || needs.prepare-sample-media.result == 'skipped') &&
            (needs.prepare-frontend-deps.result == 'success' || needs.prepare-frontend-deps.result == 'skipped') &&
            (
              needs.changes.outputs.frontend == 'true' ||
              needs.changes.outputs.go == 'true' ||
              needs.changes.outputs.docker_related == 'true'
            )
        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

            - name: Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y ffmpeg libimage-exiftool-perl

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

            - name: Set up Node.js
              uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
              with:
                  node-version: '24.14.1'
                  cache: 'npm'
                  cache-dependency-path: static/package-lock.json

            - name: Download frontend dependency artifact
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: frontend-deps
                  path: ./artifacts/frontend-deps

            - name: Extract frontend dependency artifact
              run: |
                  rm -rf ./static/node_modules
                  tar -xzf ./artifacts/frontend-deps/frontend-deps.tgz -C ./static

            - name: Install Playwright Chromium
              working-directory: ./static
              run: npx playwright install --with-deps chromium

            - name: Restore sample media cache
              uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
              with:
                  path: ${{ github.workspace }}/.sample-media-cache
                  key: sample-media-${{ hashFiles('hack/download-sample-media.sh') }}

            - name: Build Docker image for smoke tests
              uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7
              with:
                  context: .
                  file: Dockerfile
                  load: true
                  tags: media-viewer-runtime-e2e
                  platforms: linux/amd64
                  cache-from: |
                      type=gha,scope=buildkit-Dockerfile-${{ github.ref_name }}
                      type=gha,scope=buildkit-Dockerfile-main
                  cache-to: type=gha,mode=max,scope=buildkit-Dockerfile-${{ github.ref_name }}
                  provenance: false
                  sbom: false

            - name: Run Docker-backed runtime smoke suite
              run: make frontend-test-e2e-runtime-smoke-auto
              env:
                  CI: true
                  IMAGE: media-viewer-runtime-e2e
                  TEST_MEDIA_SOURCE_DIR: ${{ github.workspace }}/.sample-media-cache
                  TEST_DOCKER_KEEP_TEMP: 'true'

            - name: Upload Docker runtime Playwright results
              if: always()
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
              with:
                  name: docker-runtime-playwright-results
                  path: |
                      static/e2e/test-results/
                      static/e2e/test-results/report.json

            - name: Upload Docker runtime Playwright report
              if: always()
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
              with:
                  name: docker-runtime-playwright-report
                  path: static/e2e/playwright-report/
                  retention-days: 30

    test-docker-runtime-e2e-nvidia:
        name: Docker Runtime Smoke (NVIDIA)
        runs-on: ubuntu-latest
        needs: [changes, lint, lint-frontend, prepare-sample-media, prepare-frontend-deps]
        if: |
            always() &&
            github.event_name == 'pull_request' &&
            (needs.lint.result == 'success' || needs.lint.result == 'skipped') &&
            (needs.lint-frontend.result == 'success' || needs.lint-frontend.result == 'skipped') &&
            (needs.prepare-sample-media.result == 'success' || needs.prepare-sample-media.result == 'skipped') &&
            (needs.prepare-frontend-deps.result == 'success' || needs.prepare-frontend-deps.result == 'skipped') &&
            (
              needs.changes.outputs.frontend == 'true' ||
              needs.changes.outputs.go == 'true' ||
              needs.changes.outputs.docker_related == 'true'
            )
        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

            - name: Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y ffmpeg libimage-exiftool-perl

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

            - name: Set up Node.js
              uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
              with:
                  node-version: '24.14.1'
                  cache: 'npm'
                  cache-dependency-path: static/package-lock.json

            - name: Download frontend dependency artifact
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: frontend-deps
                  path: ./artifacts/frontend-deps

            - name: Extract frontend dependency artifact
              run: |
                  rm -rf ./static/node_modules
                  tar -xzf ./artifacts/frontend-deps/frontend-deps.tgz -C ./static

            - name: Install Playwright Chromium
              working-directory: ./static
              run: npx playwright install --with-deps chromium

            - name: Restore sample media cache
              uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
              with:
                  path: ${{ github.workspace }}/.sample-media-cache
                  key: sample-media-${{ hashFiles('hack/download-sample-media.sh') }}

            - name: Build NVIDIA Docker image for smoke tests
              uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7
              with:
                  context: .
                  file: Dockerfile.nvidia
                  load: true
                  tags: media-viewer-runtime-e2e-nvidia
                  platforms: linux/amd64
                  cache-from: |
                      type=gha,scope=buildkit-Dockerfile.nvidia-${{ github.ref_name }}
                      type=gha,scope=buildkit-Dockerfile.nvidia-main
                  cache-to: type=gha,mode=max,scope=buildkit-Dockerfile.nvidia-${{ github.ref_name }}
                  provenance: false
                  sbom: false

            - name: Run Docker-backed NVIDIA runtime smoke suite
              run: make frontend-test-e2e-runtime-smoke-auto
              env:
                  CI: true
                  IMAGE: media-viewer-runtime-e2e-nvidia
                  TEST_MEDIA_SOURCE_DIR: ${{ github.workspace }}/.sample-media-cache
                  TEST_DOCKER_KEEP_TEMP: 'true'

            - name: Upload NVIDIA Docker runtime Playwright results
              if: always()
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
              with:
                  name: docker-runtime-playwright-results-nvidia
                  path: |
                      static/e2e/test-results/
                      static/e2e/test-results/report.json

            - name: Upload NVIDIA Docker runtime Playwright report
              if: always()
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
              with:
                  name: docker-runtime-playwright-report-nvidia
                  path: static/e2e/playwright-report/
                  retention-days: 30

    # ──────────────────────────────────────────────
    # STAGE 4: Docker builds (gated on all tests)
    # ──────────────────────────────────────────────

    build-docker:
        name: Build Docker Image
        needs:
            [
                changes,
                lint,
                lint-frontend,
                test-unit,
                test-integration,
                test-frontend-unit,
                test-frontend-integration,
                test-frontend-e2e-smoke,
                test-docker-runtime-e2e,
                build-binary-check,
            ]
        if: |
            always() &&
            (needs.lint.result == 'success' || needs.lint.result == 'skipped') &&
            (needs.lint-frontend.result == 'success' || needs.lint-frontend.result == 'skipped') &&
            (needs.test-unit.result == 'success' || needs.test-unit.result == 'skipped') &&
            (needs.test-integration.result == 'success' || needs.test-integration.result == 'skipped') &&
            (needs.test-frontend-unit.result == 'success' || needs.test-frontend-unit.result == 'skipped') &&
            (needs.test-frontend-integration.result == 'success' || needs.test-frontend-integration.result == 'skipped') &&
            (needs.test-frontend-e2e-smoke.result == 'success' || needs.test-frontend-e2e-smoke.result == 'skipped') &&
            (needs.test-docker-runtime-e2e.result == 'success' || needs.test-docker-runtime-e2e.result == 'skipped') &&
            (needs.build-binary-check.result == 'success' || needs.build-binary-check.result == 'skipped') &&
            (
              (github.event_name == 'push' && needs.changes.outputs.docker_related == 'true') ||
              (github.event_name == 'pull_request')
            )
        uses: ./.github/workflows/docker-build.yml
        secrets: inherit
        with:
            push: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
            platforms: 'linux/amd64'
            dockerfile: 'Dockerfile'
        permissions:
            contents: read
            packages: write

    build-docker-nvidia:
        name: Build Docker Image (NVIDIA)
        needs:
            [
                changes,
                lint,
                lint-frontend,
                test-unit,
                test-integration,
                test-frontend-unit,
                test-frontend-integration,
                test-frontend-e2e-smoke,
                test-docker-runtime-e2e-nvidia,
                build-binary-check,
            ]
        if: |
            always() &&
            (needs.lint.result == 'success' || needs.lint.result == 'skipped') &&
            (needs.lint-frontend.result == 'success' || needs.lint-frontend.result == 'skipped') &&
            (needs.test-unit.result == 'success' || needs.test-unit.result == 'skipped') &&
            (needs.test-integration.result == 'success' || needs.test-integration.result == 'skipped') &&
            (needs.test-frontend-unit.result == 'success' || needs.test-frontend-unit.result == 'skipped') &&
            (needs.test-frontend-integration.result == 'success' || needs.test-frontend-integration.result == 'skipped') &&
            (needs.test-frontend-e2e-smoke.result == 'success' || needs.test-frontend-e2e-smoke.result == 'skipped') &&
            (needs.test-docker-runtime-e2e-nvidia.result == 'success' || needs.test-docker-runtime-e2e-nvidia.result == 'skipped') &&
            (needs.build-binary-check.result == 'success' || needs.build-binary-check.result == 'skipped') &&
            (
              (github.event_name == 'push' && needs.changes.outputs.docker_related == 'true') ||
              (github.event_name == 'pull_request')
            )
        uses: ./.github/workflows/docker-build.yml
        secrets: inherit
        with:
            push: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
            platforms: 'linux/amd64'
            dockerfile: 'Dockerfile.nvidia'
            image-suffix: '-nvidia'
        permissions:
            contents: read
            packages: write

    ci-success:
        name: CI Success
        runs-on: ubuntu-latest
        needs:
            [
                lint,
                lint-frontend,
                build-binary-check,
                test-unit,
                test-integration,
                test-race,
                test-frontend-unit,
                test-frontend-integration,
                test-frontend-e2e-smoke,
                test-docker-runtime-e2e,
                test-docker-runtime-e2e-nvidia,
                prepare-sample-media,
                prepare-frontend-deps,
                build-docker,
                build-docker-nvidia,
            ]
        if: always()
        steps:
            - name: Check required jobs passed
              run: |
                  if [[ "${{ needs.lint.result }}" == "failure" ]]; then
                    echo "Lint failed"
                    exit 1
                  fi
                  if [[ "${{ needs.lint-frontend.result }}" == "failure" ]]; then
                    echo "Frontend lint failed"
                    exit 1
                  fi
                  if [[ "${{ needs.build-binary-check.result }}" == "failure" ]]; then
                    echo "Build binary check failed"
                    exit 1
                  fi
                  if [[ "${{ needs.test-unit.result }}" == "failure" ]]; then
                    echo "Unit tests failed"
                    exit 1
                  fi
                  if [[ "${{ needs.test-frontend-unit.result }}" == "failure" ]]; then
                    echo "Frontend unit tests failed"
                    exit 1
                  fi
                  if [[ "${{ needs.test-frontend-integration.result }}" == "failure" ]]; then
                    echo "Frontend integration tests failed"
                    exit 1
                  fi
                  if [[ "${{ needs.test-frontend-e2e-smoke.result }}" == "failure" ]]; then
                    echo "Frontend Playwright smoke tests failed"
                    exit 1
                  fi
                  if [[ "${{ needs.test-docker-runtime-e2e.result }}" == "failure" ]]; then
                    echo "Docker runtime smoke tests failed"
                    exit 1
                  fi
                  if [[ "${{ needs.test-docker-runtime-e2e-nvidia.result }}" == "failure" ]]; then
                    echo "Docker runtime smoke tests failed for the NVIDIA image"
                    exit 1
                  fi
                  if [[ "${{ needs.test-integration.result }}" == "failure" ]]; then
                    echo "Integration tests failed"
                    exit 1
                  fi
                  if [[ "${{ needs.test-race.result }}" == "failure" ]]; then
                    echo "Race detector found issues"
                    exit 1
                  fi
                  if [[ "${{ needs.prepare-sample-media.result }}" == "failure" ]]; then
                    echo "Sample media preparation failed"
                    exit 1
                  fi
                  if [[ "${{ needs.prepare-frontend-deps.result }}" == "failure" ]]; then
                    echo "Frontend dependency preparation failed"
                    exit 1
                  fi
                  if [[ "${{ needs.build-docker.result }}" == "failure" ]]; then
                    echo "Docker build failed"
                    exit 1
                  fi
                  if [[ "${{ needs.build-docker-nvidia.result }}" == "failure" ]]; then
                    echo "Docker NVIDIA build failed"
                    exit 1
                  fi
                  if [[ "${{ github.event_name }}" == "pull_request" ]]; then
                    echo "All PR checks passed!"
                  else
                    echo "All branch push checks passed!"
                  fi
