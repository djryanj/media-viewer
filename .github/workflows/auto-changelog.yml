name: Auto Changelog for Bots

on:
    pull_request:
        types: [opened, reopened]
    issue_comment:
        types: [created]
    workflow_dispatch:
        inputs:
            pr_number:
                description: PR number to update CHANGELOG.md for
                required: true
                type: string

permissions:
    contents: write
    issues: write
    pull-requests: read

jobs:
    update-changelog:
        name: Update Changelog
        runs-on: ubuntu-latest
        steps:
            - name: Resolve PR context
              id: pr_context
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
              env:
                  INPUT_PR_NUMBER: ${{ inputs.pr_number }}
              with:
                  script: |
                      const botLogins = new Set([
                        'dependabot[bot]',
                        'github-actions[bot]',
                        'renovate[bot]',
                      ]);

                      let prNumber = null;

                      if (context.eventName === 'pull_request') {
                        prNumber = context.payload.pull_request?.number;
                      } else if (context.eventName === 'issue_comment') {
                        if (!context.payload.issue?.pull_request) {
                          core.info('Comment is not on a pull request; skipping.');
                          core.setOutput('should_run', 'false');
                          return;
                        }

                        const commentBody = (context.payload.comment?.body || '').trim();
                        if (!/^\/auto-changelog\b/i.test(commentBody)) {
                          core.info('Comment does not request auto-changelog; skipping.');
                          core.setOutput('should_run', 'false');
                          return;
                        }

                        prNumber = context.payload.issue.number;
                      } else if (context.eventName === 'workflow_dispatch') {
                        const rawPrNumber = (process.env.INPUT_PR_NUMBER || '').trim();
                        prNumber = Number.parseInt(rawPrNumber, 10);
                        if (!Number.isInteger(prNumber) || prNumber <= 0) {
                          core.setFailed(`Invalid PR number: ${rawPrNumber || '<empty>'}`);
                          return;
                        }
                      }

                      if (!prNumber) {
                        core.info('No pull request number resolved; skipping.');
                        core.setOutput('should_run', 'false');
                        return;
                      }

                      const { data: pr } = await github.rest.pulls.get({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        pull_number: prNumber,
                      });

                      if (!botLogins.has(pr.user.login)) {
                        core.info(`PR #${prNumber} is owned by ${pr.user.login}, not a configured bot; skipping.`);
                        core.setOutput('should_run', 'false');
                        return;
                      }

                      core.setOutput('should_run', 'true');
                      core.setOutput('pr_number', String(pr.number));
                      core.setOutput('pr_title', pr.title);
                      core.setOutput('pr_url', pr.html_url);
                      core.setOutput('head_ref', pr.head.ref);
                      core.setOutput('head_repo', pr.head.repo.full_name);

            - name: Skip unsupported run
              if: steps.pr_context.outputs.should_run != 'true'
              run: echo "Skipping auto-changelog for this event or PR"

            - name: Checkout PR branch
              if: steps.pr_context.outputs.should_run == 'true'
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ steps.pr_context.outputs.head_ref }}
                  repository: ${{ steps.pr_context.outputs.head_repo }}
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Update CHANGELOG.md
              if: steps.pr_context.outputs.should_run == 'true'
              env:
                  PR_TITLE: ${{ steps.pr_context.outputs.pr_title }}
                  PR_NUMBER: ${{ steps.pr_context.outputs.pr_number }}
                  PR_URL: ${{ steps.pr_context.outputs.pr_url }}
              run: |
                  set -e

                  echo "Processing PR #${PR_NUMBER}: ${PR_TITLE}"

                  if [ ! -f CHANGELOG.md ]; then
                      echo "CHANGELOG.md not found, skipping"
                      exit 0
                  fi

                  export ENTRY="- ${PR_TITLE} ([#${PR_NUMBER}](${PR_URL}))"

                  python3 - <<'PYEOF'
                  import re, os, sys

                  with open('CHANGELOG.md', 'r') as f:
                      content = f.read()

                  entry = os.environ['ENTRY']

                  if entry in content:
                      print("Entry already exists in CHANGELOG.md")
                      sys.exit(0)

                  # Match ## [X.Y.Z] - Unreleased  or  ## [Unreleased]
                  unreleased_re = re.compile(
                      r'^## \[[^\]]*\] - Unreleased\s*$|^## \[Unreleased\]\s*$',
                      re.MULTILINE | re.IGNORECASE,
                  )
                  unreleased = unreleased_re.search(content)

                  if unreleased:
                      sec_start = unreleased.end()
                      next_sec = re.search(r'^## ', content[sec_start:], re.MULTILINE)
                      sec_end = sec_start + next_sec.start() if next_sec else len(content)
                      section_body = content[sec_start:sec_end]

                      changed = re.search(r'^### Changed\s*\n', section_body, re.MULTILINE)
                      if changed:
                          # Insert after ### Changed header and its trailing blank line
                          pos = changed.end()
                          if section_body[pos:pos+1] == '\n':
                              pos += 1
                          insert_pos = sec_start + pos
                          new_content = content[:insert_pos] + entry + '\n' + content[insert_pos:]
                      else:
                          # No ### Changed yet — add it before the first other subsection
                          subsec = re.search(r'^### ', section_body, re.MULTILINE)
                          pos = subsec.start() if subsec else len(section_body)
                          insert_pos = sec_start + pos
                          new_content = (
                              content[:insert_pos]
                              + '### Changed\n\n' + entry + '\n\n'
                              + content[insert_pos:]
                          )
                  else:
                      # No unreleased section — create one, inferring the next patch version
                      ver_match = re.search(r'^## \[(\d+\.\d+\.\d+)\]', content, re.MULTILINE)
                      if ver_match:
                          major, minor, patch = ver_match.group(1).split('.')
                          next_ver = f"{major}.{minor}.{int(patch)+1}"
                          header = f"## [{next_ver}] - Unreleased"
                      else:
                          header = "## [Unreleased]"

                      new_block = f"{header}\n\n### Changed\n\n{entry}\n\n"
                      first_sec = re.search(r'^## ', content, re.MULTILINE)
                      insert_pos = first_sec.start() if first_sec else len(content)
                      new_content = content[:insert_pos] + new_block + content[insert_pos:]

                  with open('CHANGELOG.md', 'w') as f:
                      f.write(new_content)
                  print("Successfully updated CHANGELOG.md")
                  PYEOF

            - name: Check for changes
              if: steps.pr_context.outputs.should_run == 'true'
              id: check_changes
              run: |
                  if git diff --quiet CHANGELOG.md; then
                      echo "changed=false" >> $GITHUB_OUTPUT
                  else
                      echo "changed=true" >> $GITHUB_OUTPUT
                  fi

            - name: Commit changes
              if: steps.pr_context.outputs.should_run == 'true' && steps.check_changes.outputs.changed == 'true'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add CHANGELOG.md
                  git commit -m "docs: update CHANGELOG.md for PR #${{ steps.pr_context.outputs.pr_number }}"
                  git push

            - name: Comment on PR
              if: steps.pr_context.outputs.should_run == 'true' && steps.check_changes.outputs.changed == 'true'
              continue-on-error: true
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
              with:
                  script: |
                      await github.rest.issues.createComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: Number('${{ steps.pr_context.outputs.pr_number }}'),
                          body: 'CHANGELOG.md has been automatically updated with this PR.'
                      });
