name: Docker Build and Release

on:
    workflow_call:
        inputs:
            push:
                description: 'Push image to registry'
                required: false
                default: false
                type: boolean
            platforms:
                description: 'Target platforms'
                required: false
                default: 'linux/amd64,linux/arm64'
                type: string
            dockerfile:
                description: 'Path to Dockerfile'
                required: false
                default: 'Dockerfile'
                type: string
            image-suffix:
                description: 'Suffix to append to image tags (e.g., -nvidia)'
                required: false
                default: ''
                type: string
        outputs:
            digest:
                description: 'Image digest'
                value: ${{ jobs.build.outputs.digest }}
            tags:
                description: 'Image tags'
                value: ${{ jobs.build.outputs.tags }}

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

concurrency:
    group: docker-${{ github.ref }}-${{ inputs.dockerfile }}
    cancel-in-progress: true

jobs:
    build:
        name: Build Docker Image
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        outputs:
            digest: ${{ steps.build-push.outputs.digest }}
            tags: ${{ steps.meta.outputs.tags }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  fetch-depth: 0

            - name: Set up QEMU
              uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

            - name: Log in to Container Registry
              if: inputs.push
              uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata for Docker
              id: meta
              uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  flavor: |
                      suffix=${{ inputs.image-suffix }},onlatest=true
                  tags: |
                      # For PRs: pr-<number>
                      type=ref,event=pr
                      # For tags: v1.2.3, v1.2, v1 (preserving the v prefix)
                      type=semver,pattern=v{{version}}
                      type=semver,pattern=v{{major}}.{{minor}}
                      type=semver,pattern=v{{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
                      # SHA for traceability
                      type=sha,prefix=sha-
                      # Latest on main or tags
                      type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')) }}

            - name: Get build information
              id: build-info
              run: |
                  if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
                    echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
                  else
                    echo "version=dev-${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
                  fi
                  echo "commit=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
                  echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

            - name: Build and push Docker image
              id: build-push
              uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
              with:
                  context: .
                  file: ${{ inputs.dockerfile }}
                  platforms: ${{ github.event_name != 'pull_request' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
                  push: ${{ inputs.push }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  build-args: |
                      VERSION=${{ steps.build-info.outputs.version }}
                      COMMIT=${{ steps.build-info.outputs.commit }}
                      BUILD_TIME=${{ steps.build-info.outputs.build_time }}
                  # Aggressive caching for faster builds
                  cache-from: |
                      type=gha,scope=buildkit-${{ inputs.dockerfile }}-${{ github.ref_name }}
                      type=gha,scope=buildkit-${{ inputs.dockerfile }}-main
                  cache-to: type=gha,mode=max,scope=buildkit-${{ inputs.dockerfile }}-${{ github.ref_name }}
                  # Disable for faster builds
                  provenance: false
                  sbom: false
