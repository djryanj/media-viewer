name: Release

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write
    packages: write

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

jobs:
    # ──────────────────────────────────────────────
    # STAGE 0: Parallel preparation
    # ──────────────────────────────────────────────

    prepare-sample-media:
        name: Prepare Sample Media
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

            - name: Check if sample media cache exists
              id: cache-check
              uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
              with:
                  path: ${{ github.workspace }}/.sample-media-cache
                  key: sample-media-${{ hashFiles('hack/download-sample-media.sh') }}
                  lookup-only: true

            - name: Download sample media
              if: steps.cache-check.outputs.cache-hit != 'true'
              run: |
                  chmod +x ./hack/download-sample-media.sh
                  ./hack/download-sample-media.sh
              env:
                  MEDIA_DIR: ${{ github.workspace }}/.sample-media-cache

            - name: Save sample media cache
              if: steps.cache-check.outputs.cache-hit != 'true'
              uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
              with:
                  path: ${{ github.workspace }}/.sample-media-cache
                  key: sample-media-${{ hashFiles('hack/download-sample-media.sh') }}

    # ──────────────────────────────────────────────
    # STAGE 1: Linting (parallel, fast feedback)
    # ──────────────────────────────────────────────

    lint:
        name: Backend Lint
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

            - name: Install libvips
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libvips-dev

            - name: Set up Go
              uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Run golangci-lint
              uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9
              with:
                  version: v2.11.4
                  args: --config=.golangci.yml --timeout=5m

    lint-frontend:
        name: Frontend Lint
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

            - name: Set up Node.js
              uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
              with:
                  node-version: '24.14.1'
                  cache: 'npm'
                  cache-dependency-path: static/package-lock.json

            - name: Install frontend dependencies
              working-directory: ./static
              run: npm ci

            - name: Run ESLint (JavaScript)
              working-directory: ./static
              run: npm run lint:js

            - name: Run Stylelint (CSS)
              working-directory: ./static
              run: npm run lint:css

            - name: Check formatting (Prettier)
              working-directory: ./static
              run: npm run format:check

    # ──────────────────────────────────────────────
    # STAGE 2: Unit tests (gated on lint)
    # ──────────────────────────────────────────────

    test-unit:
        name: Backend Unit Tests
        runs-on: ubuntu-latest
        needs: lint
        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

            - name: Install libvips
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libvips-dev

            - name: Set up Go
              uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Run unit tests
              run: make test-unit

            - name: Upload coverage
              if: always()
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
              with:
                  name: release-unit-coverage
                  path: coverage-unit.out

    test-frontend-unit:
        name: Frontend Unit Tests
        runs-on: ubuntu-latest
        needs: lint-frontend
        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

            - name: Set up Node.js
              uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
              with:
                  node-version: '24.14.1'
                  cache: 'npm'
                  cache-dependency-path: static/package-lock.json

            - name: Install frontend dependencies
              working-directory: ./static
              run: npm ci

            - name: Run frontend unit tests
              working-directory: ./static
              run: npm run test:unit:only

            - name: Upload frontend unit coverage
              if: always()
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
              with:
                  name: release-frontend-unit-coverage
                  path: static/coverage/

    # ──────────────────────────────────────────────
    # STAGE 3: Integration & race tests
    #          (gated on unit tests)
    # ──────────────────────────────────────────────

    test-integration:
        name: Backend Integration Tests
        runs-on: ubuntu-latest
        needs: test-unit
        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

            - name: Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libvips-dev ffmpeg

            - name: Set up Go
              uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Run integration tests
              run: make test-integration
              env:
                  MEDIA_DIR: /tmp/media

            - name: Upload coverage
              if: always()
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
              with:
                  name: release-integration-coverage
                  path: coverage-integration.out

    test-race:
        name: Backend Race Detector
        runs-on: ubuntu-latest
        needs: test-unit
        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

            - name: Install libvips and ffmpeg
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libvips-dev ffmpeg

            - name: Set up Go
              uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Run tests with race detector
              run: make test-race

    build-binary:
        name: Build Binary for Frontend Integration Tests
        runs-on: ubuntu-latest
        needs: lint
        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

            - name: Install libvips
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libvips-dev

            - name: Set up Go
              uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Build application
              run: make build

            - name: Upload binary artifact
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
              with:
                  name: media-viewer-binary
                  path: media-viewer
                  retention-days: 1

    test-frontend-integration:
        name: Frontend Integration Tests
        runs-on: ubuntu-latest
        needs: [test-frontend-unit, build-binary, prepare-sample-media]
        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

            - name: Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libvips-dev ffmpeg

            - name: Set up Node.js
              uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
              with:
                  node-version: '24.14.1'
                  cache: 'npm'
                  cache-dependency-path: static/package-lock.json

            - name: Install frontend dependencies
              working-directory: ./static
              run: npm ci

            - name: Download backend binary
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: media-viewer-binary
                  path: .

            - name: Make binary executable
              run: chmod +x ./media-viewer

            - name: Restore sample media cache
              uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
              with:
                  path: ${{ github.workspace }}/.sample-media-cache
                  key: sample-media-${{ hashFiles('hack/download-sample-media.sh') }}

            - name: Copy sample media to runtime location
              run: |
                  cp -r ${{ github.workspace }}/.sample-media-cache /tmp/media

            - name: Start backend server
              run: |
                  mkdir -p /tmp/backend-logs
                  MEDIA_DIR=/tmp/media \
                  CACHE_DIR=/tmp/cache \
                  DATABASE_DIR=/tmp/database \
                  METRICS_ENABLED=false \
                  LOG_HEALTH_CHECKS=false \
                  LOG_LEVEL=info \
                  ./media-viewer > /tmp/backend-logs/backend-stdout.log 2>&1 &
                  BACKEND_PID=$!
                  echo "BACKEND_PID=$BACKEND_PID" >> $GITHUB_ENV
                  echo "Waiting for backend to be ready..."
                  for i in {1..30}; do
                    if curl -f http://localhost:8080/readyz > /dev/null 2>&1; then
                      echo "Backend is ready!"
                      break
                    fi
                    if [ $i -eq 30 ]; then
                      echo "Backend failed to become ready within 30 seconds"
                      echo "--- Backend logs ---"
                      cat /tmp/backend-logs/backend-stdout.log
                      exit 1
                    fi
                    sleep 1
                  done
                  sleep 5
                  echo "Verifying auth endpoint is ready..."
                  for i in {1..15}; do
                    AUTH_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/auth/check 2>/dev/null)
                    if [ "$AUTH_RESPONSE" != "000" ] && [ "$AUTH_RESPONSE" != "502" ] && [ "$AUTH_RESPONSE" != "503" ]; then
                      echo "Auth endpoint is ready (HTTP $AUTH_RESPONSE)"
                      break
                    fi
                    if [ $i -eq 15 ]; then
                      echo "Auth endpoint not ready after 15 seconds"
                      exit 1
                    fi
                    sleep 1
                  done
                  echo "Backend is fully ready!"

            - name: Run frontend integration tests
              run: make frontend-test-integration
              env:
                  TEST_BASE_URL: http://localhost:8080

            - name: Stop backend server
              if: always()
              run: |
                  if [ -n "$BACKEND_PID" ]; then
                    kill $BACKEND_PID || true
                    sleep 2
                  fi

            - name: Upload backend logs on failure
              if: failure()
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
              with:
                  name: backend-server-logs
                  path: /tmp/backend-logs/
                  retention-days: 7

            - name: Upload Playwright report
              if: always()
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
              with:
                  name: playwright-report
                  path: static/e2e/playwright-report/
                  retention-days: 30

    # ──────────────────────────────────────────────
    # STAGE 4: Docker builds (gated on ALL tests)
    # ──────────────────────────────────────────────

    docker:
        name: Build and Push Docker
        runs-on: ubuntu-latest
        needs:
            [test-unit, test-integration, test-race, test-frontend-unit, test-frontend-integration]
        outputs:
            digest: ${{ steps.build-push.outputs.digest }}
            tags: ${{ steps.meta.outputs.tags }}
            version: ${{ steps.build-info.outputs.version }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
              with:
                  fetch-depth: 0

            - name: Set up QEMU
              uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

            - name: Log in to Container Registry
              uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata for Docker
              id: meta
              uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=semver,pattern=v{{version}}
                      type=semver,pattern=v{{major}}.{{minor}}
                      type=semver,pattern=v{{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
                      type=raw,value=latest

            - name: Get build information
              id: build-info
              run: |
                  echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
                  echo "commit=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
                  echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

            - name: Build and push Docker image
              id: build-push
              uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7
              with:
                  context: .
                  file: Dockerfile
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  build-args: |
                      VERSION=${{ steps.build-info.outputs.version }}
                      COMMIT=${{ steps.build-info.outputs.commit }}
                      BUILD_TIME=${{ steps.build-info.outputs.build_time }}
                  cache-from: |
                      type=gha,scope=buildkit-Dockerfile-${{ github.ref_name }}
                      type=gha,scope=buildkit-Dockerfile-main
                  cache-to: type=gha,mode=max,scope=buildkit-Dockerfile-${{ github.ref_name }}
                  provenance: false
                  sbom: false

    docker-nvidia:
        name: Build and Push Docker (NVIDIA)
        runs-on: ubuntu-latest
        needs:
            [test-unit, test-integration, test-race, test-frontend-unit, test-frontend-integration]
        outputs:
            digest: ${{ steps.build-push.outputs.digest }}
            tags: ${{ steps.meta.outputs.tags }}
            version: ${{ steps.build-info.outputs.version }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
              with:
                  fetch-depth: 0

            - name: Set up QEMU
              uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

            - name: Log in to Container Registry
              uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata for Docker
              id: meta
              uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  flavor: |
                      suffix=-nvidia,onlatest=true
                  tags: |
                      type=semver,pattern=v{{version}}
                      type=semver,pattern=v{{major}}.{{minor}}
                      type=semver,pattern=v{{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
                      type=raw,value=latest

            - name: Get build information
              id: build-info
              run: |
                  echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
                  echo "commit=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
                  echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

            - name: Build and push Docker image
              id: build-push
              uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7
              with:
                  context: .
                  file: Dockerfile.nvidia
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  build-args: |
                      VERSION=${{ steps.build-info.outputs.version }}
                      COMMIT=${{ steps.build-info.outputs.commit }}
                      BUILD_TIME=${{ steps.build-info.outputs.build_time }}
                  cache-from: |
                      type=gha,scope=buildkit-Dockerfile.nvidia-${{ github.ref_name }}
                      type=gha,scope=buildkit-Dockerfile.nvidia-main
                  cache-to: type=gha,mode=max,scope=buildkit-Dockerfile.nvidia-${{ github.ref_name }}
                  provenance: false
                  sbom: false

    # ──────────────────────────────────────────────
    # STAGE 5: SBOM + GitHub Release
    # ──────────────────────────────────────────────

    sbom:
        name: Generate SBOM
        runs-on: ubuntu-latest
        needs: docker
        outputs:
            sbom-file: ${{ steps.sbom.outputs.sbom-file }}
        steps:
            - name: Log in to Container Registry
              uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Generate SBOM
              id: sbom
              uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
              with:
                  image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.docker.outputs.digest }}
                  format: spdx-json
                  output-file: ${{ github.event.repository.name }}-${{ needs.docker.outputs.version }}-sbom.spdx.json

            - name: Upload SBOM as artifact
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
              with:
                  name: sbom
                  path: ${{ github.event.repository.name }}-${{ needs.docker.outputs.version }}-sbom.spdx.json
                  retention-days: 90

    sbom-nvidia:
        name: Generate SBOM (NVIDIA)
        runs-on: ubuntu-latest
        needs: docker-nvidia
        outputs:
            sbom-file: ${{ steps.sbom.outputs.sbom-file }}
        steps:
            - name: Log in to Container Registry
              uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Generate SBOM
              id: sbom
              uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
              with:
                  image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.docker-nvidia.outputs.digest }}
                  format: spdx-json
                  output-file: ${{ github.event.repository.name }}-${{ needs.docker-nvidia.outputs.version }}-nvidia-sbom.spdx.json

            - name: Upload SBOM as artifact
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
              with:
                  name: sbom-nvidia
                  path: ${{ github.event.repository.name }}-${{ needs.docker-nvidia.outputs.version }}-nvidia-sbom.spdx.json
                  retention-days: 90

    release:
        name: Create GitHub Release
        runs-on: ubuntu-latest
        needs: [docker, docker-nvidia, sbom, sbom-nvidia]
        steps:
            - name: Checkout code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
              with:
                  fetch-depth: 0

            - name: Download SBOM artifact
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: sbom
                  path: ./artifacts

            - name: Download NVIDIA SBOM artifact
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: sbom-nvidia
                  path: ./artifacts

            - name: Generate changelog
              id: changelog
              uses: mikepenz/release-changelog-builder-action@2cb9befdbc05f65b8354cc9873cd506509bd0782 # v6
              with:
                  configuration: .github/changelog-config.json
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Create Release
              uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
              with:
                  body: |
                      ${{ steps.changelog.outputs.changelog }}

                      ---

                      ## Docker Images

                      ### Standard Image (Alpine-based, VA-API support)
                      ```bash
                      docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.docker.outputs.version }}
                      ```

                      **Available tags:**
                      - `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.docker.outputs.version }}`
                      - `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest`

                      **Digest:** `${{ needs.docker.outputs.digest }}`

                      ### NVIDIA Image (Debian-based, NVIDIA NVENC support)
                      ```bash
                      docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.docker-nvidia.outputs.version }}-nvidia
                      ```

                      **Available tags:**
                      - `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.docker-nvidia.outputs.version }}-nvidia`
                      - `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-nvidia`

                      **Digest:** `${{ needs.docker-nvidia.outputs.digest }}`

                      ## Software Bill of Materials (SBOM)

                      SBOMs for both images are attached below in SPDX JSON format.
                  draft: false
                  prerelease: ${{ contains(github.ref_name, '-') }}
                  files: |
                      ./artifacts/*.spdx.json
