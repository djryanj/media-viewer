name: Set up ffmpeg
description: >-
    Installs a pinned static ffmpeg and ffprobe (johnvansickle.com) and adds them
    to PATH. The tarball is verified against a SHA-256 stored in this file and
    cached, so a run only touches the network on a cold cache, and a flaky
    download is retried. Only linux/amd64 (ubuntu-latest) is supported.

runs:
    using: composite
    steps:
        - name: Restore ffmpeg cache
          id: cache
          uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
          with:
              path: ~/ffmpeg-static
              key: ffmpeg-static-7.0.2-amd64-abda8d77ce83

        - name: Download ffmpeg
          if: steps.cache.outputs.cache-hit != 'true'
          shell: bash
          env:
              FFMPEG_VERSION: 7.0.2
              FFMPEG_SHA256: abda8d77ce8309141f83ab8edf0596834087c52467f6badf376a6a2a4c87cf67
          run: |
              set -euo pipefail
              tmp="$(mktemp -d)"
              archive="$tmp/ffmpeg.tar.xz"
              # The latest release lives in releases/ and moves to old-releases/
              # when a newer one is published; -f makes a 404 fall through.
              for dir in releases old-releases; do
                  if curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --max-time 300 \
                      -o "$archive" "https://johnvansickle.com/ffmpeg/$dir/ffmpeg-$FFMPEG_VERSION-amd64-static.tar.xz"; then
                      break
                  fi
              done
              echo "$FFMPEG_SHA256  $archive" | sha256sum -c -
              mkdir -p ~/ffmpeg-static
              tar -xJf "$archive" -C ~/ffmpeg-static --strip-components=1 --wildcards '*/ffmpeg' '*/ffprobe'

        - name: Add ffmpeg to PATH
          shell: bash
          run: |
              echo "$HOME/ffmpeg-static" >> "$GITHUB_PATH"
              "$HOME/ffmpeg-static/ffmpeg" -version | head -1
